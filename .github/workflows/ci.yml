name: CI Backend

on:
  push:
    branches: [back-end-quizzin]
  pull_request:
    branches: [back-end-quizzin]

jobs:
  check:
    name: Audit & syntaxe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification des vulnérabilités (high+)
        run: npm audit --audit-level=high

      - name: Vérification syntaxe Node.js
        run: node --check server.js controllers/authControllers.js controllers/friendControllers.js controllers/quizControllers.js controllers/scoreControllers.js
